name: Lexa
options:
  bundleIdPrefix: com.yelizakdag.lexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: H75Z7U427Y
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  Lexa:
    type: application
    platform: iOS
    sources:
      - path: Lexa
      - path: Shared
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: LexaWidget
        embed: true
    entitlements:
      path: Lexa/Lexa.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yelizakdag.lexa
    info:
      path: Lexa/Info.plist
      properties:
        CFBundleDisplayName: LEXA
        CFBundleDevelopmentRegion: tr
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Newsreader.ttf
          - Newsreader-Italic.ttf
          - IBMPlexSans.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yelizakdag.lexa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  LexaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LexaWidget
      - path: Shared
      - path: Lexa/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: LexaWidget/LexaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yelizakdag.lexa
    info:
      path: LexaWidget/Info.plist
      properties:
        CFBundleDisplayName: LEXA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Newsreader.ttf
          - IBMPlexSans.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yelizakdag.lexa.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
