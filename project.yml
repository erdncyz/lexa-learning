name: Lexa
options:
  bundleIdPrefix: com.lexa-learning.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: H75Z7U427Y
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

targets:
  Lexa:
    type: application
    platform: iOS
    sources:
      - path: Lexa
      - path: Shared
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: LexaWidget
        embed: true
    entitlements:
      path: Lexa/Lexa.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lexa-learning.app
    info:
      path: Lexa/Info.plist
      properties:
        CFBundleDisplayName: LEXA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: tr
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Newsreader.ttf
          - Newsreader-Italic.ttf
          - IBMPlexSans.ttf
        ITSAppUsesNonExemptEncryption: false
        # Google ile giriş sonrası uygulamaya dönüş (GoogleService-Info.plist → REVERSED_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.259813578972-scpevf5kjp8j1ett5442v69n5c5vmpcu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexa-learning.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  LexaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LexaWidget
      - path: Shared
      - path: Lexa/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: LexaWidget/LexaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lexa-learning.app
    info:
      path: LexaWidget/Info.plist
      properties:
        CFBundleDisplayName: LEXA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Newsreader.ttf
          - IBMPlexSans.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexa-learning.app.widget
        DEVELOPMENT_TEAM: H75Z7U427Y
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
